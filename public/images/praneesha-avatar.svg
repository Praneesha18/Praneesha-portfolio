  <desc id="desc">A warm vector avatar with dark hair, glasses, pearl earrings, and crossed hands</desc>
  <defs>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2a2fa"/><stop offset="1" stop-color="#a778df"/></linearGradient>
