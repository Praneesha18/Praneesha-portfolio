  <style>
    .hand-left { transform-box: fill-box; transform-origin: 80% 15%; animation: little-wave-left 2.8s ease-in-out infinite; }
    .hand-right { transform-box: fill-box; transform-origin: 20% 15%; animation: little-wave-right 2.8s ease-in-out infinite; }
    @keyframes little-wave-left { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-2.2deg) translateY(-4px); } }
    @keyframes little-wave-right { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(2.2deg) translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .hand-left,.hand-right { animation:none; } }
  </style>
